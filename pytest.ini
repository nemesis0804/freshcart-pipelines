[pytest]
pythonpath = .
testpaths = tests
# Prevent pytest from scanning iris_project/ transformer files directly.
# Those files contain Mage @test decorated functions named test_* which
# pytest would otherwise try to collect as test cases (they require a
# positional 'output' argument and fail with "fixture not found").
norecursedirs = iris_project elt stream report evidence screenshots .git .venv venv env
